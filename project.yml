name: iSoulseek

options:
  bundleIdPrefix: com.icraze
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  iSoulseek:
    type: application
    platform: iOS
    sources:
      - path: iSoulseek
    dependencies:
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icraze.iSoulseek
        PRODUCT_NAME: iSoulseek
        # No app icon yet; without this the asset catalog compiler fails looking for "AppIcon".
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: iSoulseek
        ENABLE_TESTABILITY: YES
    info:
      path: iSoulseek/App/Info.plist
      properties:
        CFBundleDisplayName: iSoulseek
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: iSoulseek connects to peers on your local network for file transfers.

  iSoulseekTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iSoulseekTests
    dependencies:
      - target: iSoulseek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icraze.iSoulseekTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal

  iSoulseekUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iSoulseekUITests
    dependencies:
      - target: iSoulseek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icraze.iSoulseekUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  iSoulseek:
    build:
      targets:
        iSoulseek: all
        iSoulseekTests: [test]
        iSoulseekUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - iSoulseekTests
        - iSoulseekUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
